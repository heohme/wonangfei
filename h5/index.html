<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>窝囊费 · 每一秒，都算数</title><meta name="description" content="按时间看见收入，用小目标点亮生活。支持金额与脱敏模式，工资数据仅保存在当前浏览器。"><meta name="theme-color" content="#f5f3ec"><link rel="icon" href="./icon.png"><link rel="stylesheet" href="./style.css?v=1.1.0"></head><body>
<main><header class="minimal-header"><button id="view-toggle" class="corner-control" type="button" aria-label="切换金额或脱敏展示"><span id="view-icon">¥</span><small id="view-label">金额</small></button><div class="brand">窝囊费</div><button id="time-toggle" class="corner-control" type="button" aria-label="切换全天或仅工作时间"><span id="time-icon">◷</span><small id="time-label">全天</small></button></header><div class="legacy-controls" hidden><nav class="mode-switch" aria-label="计薪模式"><button id="mode-all">全天</button><button id="mode-work">工作时间</button></nav><button id="today-options">调整今天</button></div>
<div class="eyebrow"><span class="dot"></span><span id="status">今天也在努力生活</span></div>
<section class="receipt"><div id="unlock-view" hidden><p class="unlock-eyebrow">把努力，变成喜欢的样子</p><div id="product-art" class="product-art" role="img" aria-label="物品解锁进度"></div><div class="anchor-switch"><button id="anchor-prev" aria-label="上一个物品">‹</button><h2 id="anchor-name"></h2><button id="anchor-next" aria-label="下一个物品">›</button></div><p id="anchor-caption"></p><div id="anchor-progress-track" class="unlock-track" role="progressbar" aria-label="物品解锁进度" aria-valuemin="0" aria-valuemax="100"><i id="anchor-progress"></i></div><div class="unlock-meta"><p id="anchor-percent" class="anchor-percent"></p><span id="offer-info" class="offer-info" hidden><a id="offer-source" target="_blank" rel="noopener noreferrer">查看什么值得买 ↗</a></span></div><p id="anchor-source" class="unlock-note" hidden></p><button id="anchor-picker" class="anchor-picker">换个盼头 ⌄</button></div><div id="money-view"><div class="income-period" role="group" aria-label="收入统计周期"><button id="period-day" aria-pressed="true">今天</button><button id="period-month" aria-pressed="false">本月</button></div><div class="receipt-top"><span>今日收入</span><span id="date"></span></div><div class="income-stage"><div id="worker" class="worker" aria-hidden="true"><span class="worker-head"><i></i></span><span class="worker-body"></span><span class="arm left"></span><span class="arm right"></span><span class="laptop"></span><span class="desk"></span><span class="spark">✦</span></div><div class="income-number"><p id="income-label" class="label">今天已经赚到</p><h1><small>¥</small><span id="earned">0.00</span></h1></div></div><p id="quip">每一秒，都在靠近想要的生活。</p><div class="track"><i id="day-progress"></i></div><div class="receipt-bottom"><span id="countdown">等待开工</span><span id="daily">日薪 ¥0</span></div><div class="stats"><div><span>每小时进账</span><strong id="hourly">¥0.00</strong></div><div><span>今日愿望基金</span><strong id="fund">¥0.00</strong></div></div></div></section>
<div class="mood-card"><div id="mascot" class="mascot">◡</div><div><b id="mood-title">努力也有回声</b><p id="mood-note">每一秒，都在靠近喜欢的生活。</p></div><span id="coffee">☕ × 0</span></div><span id="demo-note" hidden></span>

<nav class="action-dock" aria-label="快捷操作"><button id="demo" aria-label="体验演示" title="体验演示">▷</button><button id="open-wishes" aria-label="最近种草" title="最近种草"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button><button id="share" aria-label="分享今日进度" title="分享"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></button><button id="settings" aria-label="工资与作息设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></nav><footer id="privacy">收入为估算 · 数据仅保存在本机</footer><p class="footnote">愿望达标表示估算基金已够，不代表真实存款到账。</p></main><div id="wish-panel" class="wish-panel overlay" hidden><section class="wishes modal" role="dialog" aria-modal="true" aria-label="最近种草"><button id="close-wishes" class="drawer-close" aria-label="关闭最近种草">×</button><div class="section-head"><div><h2>最近种草 <span id="wish-count">0</span></h2><p>喜欢的东西，一点点攒。</p></div><button id="add" class="plus" aria-label="加个小目标">＋</button></div><div class="fund-line"><span>累计愿望基金</span><b id="total">¥0.00</b></div><div id="wish-list"></div><button id="add-bottom" class="add-bottom">＋ 加个小目标</button></section></div>
<div id="overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="section-head"><h2 id="modal-title"></h2><button id="close" class="icon" aria-label="关闭">×</button></div><div id="modal-body"></div></section></div><div id="toast" role="status" aria-live="polite"></div><script src="./calc.js?v=1.1.0"></script><script src="./web.js?v=1.1.0"></script><script src="./app.js?v=1.1.0"></script></body></html>
